<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<title>SAG 工作区</title><style>
:root{color-scheme:light dark;font:15px system-ui;background:#101315;color:#edf0ed}body{max-width:920px;margin:0 auto;padding:44px 32px}h1{font-size:30px;margin:8px 0}p{color:#acb7b5;line-height:1.7}header{margin-bottom:32px}small{color:#92bca9;letter-spacing:.12em}main{display:grid;grid-template-columns:1fr 1fr;gap:32px}section{border:1px solid #384441;border-radius:14px;padding:24px}h2{font-size:19px;margin:0 0 18px}label{display:block;font-weight:600;margin:16px 0 7px}input,select{box-sizing:border-box;width:100%;background:#171d1b;color:inherit;border:1px solid #52615b;border-radius:7px;padding:10px;font:inherit}button{font:inherit;border:1px solid #52615b;border-radius:7px;padding:8px 13px;cursor:pointer;background:#25352d;color:inherit;margin:5px 5px 0 0}button.primary{background:#bde4cc;color:#10251a;border-color:#bde4cc;font-weight:650}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #bde4cc;outline-offset:3px}.connection{padding:16px 0;border-top:1px solid #384441;overflow-wrap:anywhere}.connection:first-child{border-top:0}.address{font-size:12px;color:#acb7b5;margin:6px 0}.badge{color:#c4e7d0;font-size:12px}#message{white-space:pre-wrap;background:#263029;border-left:3px solid #bde4cc;padding:16px;line-height:1.6;margin-bottom:24px}#message:empty{display:none}.help{font-size:13px}button:disabled{opacity:.5;cursor:wait}@media(max-width:760px){main{grid-template-columns:1fr}body{padding:24px}}
</style></head><body><header><small>SAG / WORKSPACES</small><h1>选择你的知识工作区</h1><p>本机运行自己的知识库，也可以连接 NAS 工作台。切换只改变这台电脑上的连接，知识与任务保留在各自服务器。</p></header>
<div id="message" role="status" aria-live="polite"></div><main><section><h2>已保存的工作区</h2><div id="connections"></div></section><section><h2 id="form-title">连接 NAS / 远程工作台</h2><form id="connection-form"><input id="profile-id" type="hidden"><label for="name">连接名称</label><input id="name" maxlength="120" required placeholder="家中的 NAS"><label for="deployment">服务器类型</label><select id="deployment"><option value="fnos">fnOS SAG</option><option value="standard">标准 SAG Web / Docker</option></select><label for="web-url">工作台地址</label><input id="web-url" type="url" required placeholder="https://nas.example/app/sag"><p class="help">填写工作台的完整地址和应用前缀。fnOS 通常使用 /app/sag。此地址与模型 Base URL、CLI 自动化 API 地址分别保存。</p><button class="primary" type="submit">保存连接</button><button id="clear" type="button">新建连接</button></form><p class="help">每个连接使用独立登录状态。修改服务器地址或前缀后需要重新登录。证书错误请修复服务端证书。</p></section></main><script src="workspaces.js"></script></body></html>
