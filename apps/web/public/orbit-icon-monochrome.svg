<svg
  xmlns="http://www.w3.org/2000/svg"
  width="890"
  height="870"
  viewBox="0 0 89 87"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Monochrome orbit icon</title>
  <desc id="desc">
    A black and white rotationally symmetric orbit icon with two hollow nodes and
    a solid white center outlined in black.
  </desc>

  <!-- Preserve the source image's 89:87 canvas ratio and asymmetric-looking,
       rotationally symmetric negative space. -->
  <rect width="89" height="87" fill="#fff" />

  <!-- Two orbit strokes are exact 180-degree rotations around (44.5, 43.5). -->
  <g
    fill="none"
    stroke="#000"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M 47.5 24.23 A 19.5 19.5 0 0 0 30.25 56.80" />
    <path d="M 58.75 30.20 A 19.5 19.5 0 0 1 41.5 62.77" />
  </g>

  <!-- Hollow nodes: solid black bodies with centered white cut-outs. -->
  <g fill="#000">
    <circle cx="59.5" cy="29.5" r="6" />
    <circle cx="29.5" cy="57.5" r="6" />
  </g>
  <g fill="#fff">
    <circle cx="59.5" cy="29.5" r="2.25" />
    <circle cx="29.5" cy="57.5" r="2.25" />
  </g>

  <!-- Solid center with a distinct outer outline. -->
  <circle cx="44.5" cy="43.5" r="8.5" fill="#000" />
  <circle cx="44.5" cy="43.5" r="6.5" fill="#fff" />
</svg>
