<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="1024"
  height="1024"
  viewBox="0 0 96 96"
  role="img"
  aria-labelledby="title desc"
  shape-rendering="geometricPrecision"
>
  <title id="title">Open taiji orbit logo</title>
  <desc id="desc">
    Two open, rotationally symmetric taiji forms orbit a solid central sphere.
  </desc>

  <rect width="96" height="96" fill="#fff" />

  <defs>
    <!-- One organic taiji half: a rounded head flows into a curved body and
         narrows continuously into an open pointed tail. -->
    <g id="taiji-half">
      <path
        fill="#000"
        d="M 67.4 29.6
           C 75.5 38.0 76.2 52.2 70.0 62.0
           C 63.8 71.7 52.2 76.2 38.8 71.2
           C 50.0 70.3 57.8 66.1 62.8 59.6
           C 69.2 51.3 69.0 40.8 64.5 33.0
           Z"
      />

      <!-- The head and its negative dot preserve the yin-yang reference. -->
      <circle cx="66.5" cy="30.5" r="6" fill="#000" />
      <circle cx="66.5" cy="30.5" r="2.15" fill="#fff" />
    </g>
  </defs>

  <!-- A single source shape is rotated to guarantee exact 180° symmetry. -->
  <use href="#taiji-half" xlink:href="#taiji-half" />
  <use
    href="#taiji-half"
    xlink:href="#taiji-half"
    transform="rotate(180 48 48)"
  />

  <!-- Independent solid sphere at the visual and rotational center. -->
  <circle cx="48" cy="48" r="6" fill="#000" />
</svg>
