name: fnOS Delivery

on:
  workflow_dispatch:
    # No inputs: the fnOS release line advances its own semantic patch
    # version. Historical `fnos-vx.y.z-fnos.N` tags are migration inputs,
    # but every new release is named `fnos-vx.y.z-fnos`.

concurrency:
  group: fnos-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      base_version: ${{ steps.resolve.outputs.base_version }}
    steps:
      - name: Enforce fnos/develop trigger branch
        shell: bash
        run: |
          set -euo pipefail
          test "${{ github.ref }}" = "refs/heads/fnos/develop" \
            || { echo "Publish must be triggered from fnos/develop (got ${{ github.ref }})"; exit 1; }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve base version from git tags
        id: find-base
        shell: bash
        run: |
          set -euo pipefail
          # Public semver is only the bootstrap base when no fnOS release
          # exists. Tags must match exactly v<major>.<minor>.<patch>.
          base="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | head -1 \
            | sed 's/^v//')"
          test -n "$base" || { echo "No base version tag found"; exit 1; }
          echo "Base version: $base"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Resolve fnOS version
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE="${{ steps.find-base.outputs.base }}"

          existing="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName --jq '.[].tagName' 2>/dev/null || true)"
          VERSION="$(printf '%s\n' "$existing" | node scripts/fnos-version.mjs --fallback-base "$BASE")"
          echo "Auto-derived fnOS version: $VERSION"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "base_version=${VERSION%-fnos}" >> "$GITHUB_OUTPUT"

  native-x86:
    name: Build & publish Native x86 FPK
    runs-on: ubuntu-24.04
    needs: resolve-version
    permissions:
      contents: write
    env:
      SAG_VERSION: ${{ needs.resolve-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.8"
          enable-cache: true

      - name: Install verified fnpack 1.2.3
        shell: bash
        run: |
          set -euo pipefail
          install -d "$RUNNER_TEMP/fnpack-bin"
          curl --fail --location --proto '=https' --tlsv1.2 \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 \
            --output "$RUNNER_TEMP/fnpack-bin/fnpack"
          echo '54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93  fnpack' \
            | (cd "$RUNNER_TEMP/fnpack-bin" && sha256sum --check --strict -)
          chmod 0755 "$RUNNER_TEMP/fnpack-bin/fnpack"
          echo "$RUNNER_TEMP/fnpack-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/fnpack-bin/fnpack" --help

      - name: Validate publish request
        shell: bash
        run: |
          set -euo pipefail
          # Defense-in-depth: resolve-version already gates on this branch,
          # but native-x86 checks out its own copy, so re-verify here.
          test "${{ github.ref }}" = "refs/heads/fnos/develop" \
            || { echo "Publish must be triggered from fnos/develop"; exit 1; }
          test -n "$SAG_VERSION"
          test -s docs/fnos/evidence/native-p0-x86.json \
            || { echo "Missing native-p0-x86.json evidence"; exit 1; }

      - name: Test Native implementation
        shell: bash
        env:
          SAG_FNPACK_TESTS: "1"
        run: |
          set -euo pipefail
          cd apps/api
          uv run --extra dev ruff check sag_api sag_agent tests
          uv run --extra dev pytest -q
          cd ../web
          npm ci
          npm run typecheck
          npm run test:unit
          cd ../..
          node --test scripts/tests/fnos-*.test.mjs

      - name: Build offline Native inputs
        shell: bash
        run: |
          set -euo pipefail
          cd apps/web
          NEXT_PUBLIC_APP_BASE_PATH=/app/sag \
            NEXT_PUBLIC_API_BASE=/app/sag \
            NEXT_PUBLIC_ENABLE_WINDOW_SCALING=0 \
            npm run build
          cd ../..
          node scripts/build-fnos-native-vendor.mjs \
            --platform linux/amd64 \
            --output "$RUNNER_TEMP/vendor"
          node scripts/build-fnos-native-package.mjs \
            --platform x86 \
            --vendor "$RUNNER_TEMP/vendor" \
            --web apps/web/.next/standalone \
            --version "$SAG_VERSION" \
            --output "sag-$SAG_VERSION-x86.fpk"
          sha256sum "sag-$SAG_VERSION-x86.fpk" > "sag-$SAG_VERSION-x86.fpk.sha256"

      - name: Publish Native x86 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "fnos-v$SAG_VERSION" \
            "sag-$SAG_VERSION-x86.fpk" \
            "sag-$SAG_VERSION-x86.fpk.sha256" \
            --title "SAG fnOS Native x86 $SAG_VERSION" \
            --notes "Published from fnos/develop @ ${GITHUB_SHA}

          - **Base version**: ${{ needs.resolve-version.outputs.base_version }}
          - **FPK**: sag-$SAG_VERSION-x86.fpk
          - **SHA256**: $(cat sag-$SAG_VERSION-x86.fpk.sha256 | awk '{print $1}')"
