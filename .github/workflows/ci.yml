name: CI

on:
  push:
    branches: [main, dev, fnos/develop]
  pull_request:
  workflow_call:

jobs:
  release-safety:
    name: 发布流程 · 安全回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: 测试公开仓标签发布边界
        run: node --test scripts/tests/release-public.test.mjs
      - name: 测试 fnOS Native 包、生命周期与发布流水线
        env:
          # CI intentionally does not download an unverified fnpack executable.
          # The fnpack structural test runs only on a pre-verified runner with
          # SAG_FNPACK_TESTS=1; deterministic package behavior still runs here.
          SAG_FNPACK_TESTS: "0"
        run: node --test scripts/tests/fnos-native-package.test.mjs scripts/tests/fnos-native-lifecycle.test.mjs scripts/tests/fnos-native-data-lifecycle.test.mjs scripts/tests/fnos-native-probe.test.mjs scripts/tests/fnos-native-release-workflow.test.mjs scripts/tests/fnos-dispatch-workflow.test.mjs scripts/tests/fnos-api-image-layout.test.mjs
      - name: 测试内部快照导出边界
        if: ${{ hashFiles('scripts/tests/public-port.test.mjs') != '' }}
        run: node --test scripts/tests/public-export-policy.test.mjs scripts/tests/public-port.test.mjs

  backend:
    name: 后端 · ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.10.8"
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - name: 安装依赖
        run: uv sync --frozen --extra dev
      - name: Lint（ruff）
        run: uv run --extra dev ruff check sag_api/ sag_agent/ tests/
      - name: 测试（离线全套）
        run: uv run --extra dev pytest -q

  frontend:
    name: 前端 · tsc + next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 类型检查
        run: npx tsc --noEmit
      - name: Lint（ESLint）
        run: npm run lint
      - name: 单元测试
        run: npm run test:unit
      - name: 生产构建
        run: npm run build
