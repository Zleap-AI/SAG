name: Wiki Apple credential handoff

on:
  pull_request:
    paths:
      - ".github/workflows/wiki-apple-secrets.yml"
      - "scripts/wiki-signing-bootstrap/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wiki-apple-secrets-${{ github.repository }}
  cancel-in-progress: false

jobs:
  tests:
    name: Test sealing with disposable credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts/wiki-signing-bootstrap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Test handoff boundaries and sealed-box round trips
        run: npm test

  seal:
    name: Seal Apple credentials for Wiki release
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'Zleap-AI/SAG' &&
      github.ref == 'refs/heads/main'
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: desktop-release
    defaults:
      run:
        working-directory: scripts/wiki-signing-bootstrap
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install locked dependencies before exposing credentials
        run: npm ci --ignore-scripts
      - name: Seal the five credentials for the reviewed Wiki public key
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node encrypt.mjs
      - name: Upload only the sealed handoff
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apple-secrets-for-sag-wiki-${{ github.run_id }}-${{ github.run_attempt }}
          path: scripts/wiki-signing-bootstrap/apple-secrets-for-sag-wiki.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
